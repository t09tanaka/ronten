[package]
name = "ronten"
version = "0.1.0"
edition = "2021"
description = "Concern-based PR review viewer: agents propose concerns, humans review in the browser, agents get JSON back"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rust-embed = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
humantime = "2"
rand = "0.9"
open = "5"
mime_guess = "2"
similar = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
