[package]
name = "ronten"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Concern-based PR review viewer: agents propose concerns, humans review in the browser, agents get JSON back"
license = "MIT"
# The published crate ships the prebuilt frontend (frontend/dist) instead of
# the frontend sources, so `cargo install ronten` needs no Node.js and
# build.rs never modifies the package source tree during verification.
# Note: cargo auto-includes LICENSE/README files it finds anywhere in the
# package directory, so remove frontend/node_modules before `cargo package`
# / `cargo publish` to keep dependency license files out of the crate (the
# CI `package` job does this; frontend/dist is gitignored but intentionally
# included here, so packaging requires --allow-dirty — see .github/workflows/ci.yml).
include = [
    "Cargo.toml",
    "build.rs",
    "src/**",
    "fixtures/**",
    "frontend/dist/**",
    "README.md",
    "LICENSE",
]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rust-embed = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
humantime = "2"
rand = "0.10"
open = "5"
mime_guess = "2"
similar = "3"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
