name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs (the version tag is the trailing
# comment) so a moved tag cannot silently change what runs in CI; Dependabot
# keeps the pins current (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          # Matches rust-toolchain.toml; the dtolnay action's env override
          # is what CI actually resolves, so the two must agree.
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      # 1.85 is the actual floor: it's clap 4.6.2's declared MSRV (the
      # highest among locked build-relevant dependencies — some dev-only
      # deps used solely by integration tests declare higher, but those
      # aren't compiled by a plain `cargo check`). Verified empirically by
      # running this exact check under a 1.85 toolchain locally before
      # adding this job.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # (same pinned action commit)
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: Check at MSRV
        # `cargo check` still runs build.rs (which shells out to npm), hence
        # setup-node here too — kept as a single straightforward step rather
        # than pre-building the frontend separately to avoid the extra
        # complexity of splitting a build.rs-driven install/build across jobs.
        run: cargo check --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-deny,cargo-audit
      - name: Advisories, licenses, bans, sources (cargo deny)
        run: cargo deny check
      - name: RustSec advisories (cargo audit)
        run: cargo audit

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: Build frontend dist
        run: cargo build --locked
      - name: Verify build didn't modify tracked files
        # `cargo build` runs build.rs, which shells out to npm; this asserts
        # that doing so left every tracked file exactly as committed (only
        # gitignored output like frontend/dist should have changed).
        run: git diff --exit-code HEAD --
      - name: Drop node_modules (keeps dependency licenses out of the crate)
        run: rm -rf frontend/node_modules
      - name: Package
        # frontend/dist is a gitignored build artifact deliberately shipped in
        # the crate (see Cargo.toml include), so the VCS dirty-check cannot
        # pass; --allow-dirty is required and the content check below is the
        # real gate.
        run: cargo package --locked --allow-dirty
      - name: Verify crate contents
        run: |
          cargo package --locked --list --allow-dirty > /tmp/package-files.txt
          grep -q '^frontend/dist/index\.html$' /tmp/package-files.txt
          grep -q '^frontend/dist/assets/.*\.js$' /tmp/package-files.txt
          grep -q '^frontend/dist/assets/.*\.css$' /tmp/package-files.txt
          grep -q '^frontend/dist/shippori-mincho-OFL\.txt$' /tmp/package-files.txt
          grep -q '^frontend/dist/highlight-js-BSD-3-Clause\.txt$' /tmp/package-files.txt
          if grep -q 'node_modules' /tmp/package-files.txt; then
            echo 'node_modules leaked into the crate' >&2; exit 1
          fi
      - name: Verify packaged artifact actually contains the frontend
        # The listing check above only reflects what `cargo package --list`
        # *intends* to include; this unpacks the real .crate tarball and
        # checks the file is actually inside it. Entries are under a
        # `ronten-<version>/` prefix, hence the end-anchor-only pattern.
        run: |
          tar -tzf target/package/ronten-*.crate | grep -q 'frontend/dist/index\.html$'
      - name: Install from the packaged crate and smoke-test
        # What a `cargo install ronten` user actually gets: unpack the real
        # .crate (its build.rs must use the shipped frontend/dist without
        # touching npm), install it, and run it. build.rs's packaged-crate
        # branch never invokes npm — enforced by the git-diff check above
        # staying clean plus this install succeeding from the crate contents
        # alone.
        run: |
          mkdir -p /tmp/crate-smoke
          tar -xzf target/package/ronten-*.crate -C /tmp/crate-smoke
          cargo install --locked --path /tmp/crate-smoke/ronten-* --root /tmp/crate-smoke/install
          /tmp/crate-smoke/install/bin/ronten --version
          /tmp/crate-smoke/install/bin/ronten schema --output > /dev/null

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
